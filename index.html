<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CS2 HUB — сайт для любителей Counter-Strike 2</title>
<style>
:root {
  --accent: #f7b731;
  --bg: #0d1117;
  --bg-2: #131a24;
  --bg-3: #1a2331;
  --border: #263244;
  --text: #e6edf3;
  --muted: #8b98a9;
  --radius: 14px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: "Segoe UI", Roboto, Arial, sans-serif;
  background: linear-gradient(180deg, var(--bg) 0%, #0a0e14 100%);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.container { width: min(1160px, 92%); margin: 0 auto; }
main.container { flex: 1; padding: 32px 0 60px; }

a { color: var(--accent); text-decoration: none; }
.muted { color: var(--muted); }

/* ---------- header ---------- */
.header {
  position: sticky; top: 0; z-index: 50;
  background: rgba(13, 17, 23, .85);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
}
.header-inner { display: flex; align-items: center; gap: 28px; height: 64px; }
.logo { font-size: 22px; font-weight: 800; color: var(--text); letter-spacing: 1px; }
.logo span { color: var(--accent); }
.nav { display: flex; gap: 20px; flex: 1; }
.nav a { color: var(--muted); font-weight: 600; font-size: 15px; padding: 6px 0; border-bottom: 2px solid transparent; }
.nav a:hover { color: var(--text); }
.nav a.active { color: var(--accent); border-bottom-color: var(--accent); }

.auth-area { display: flex; align-items: center; gap: 12px; }
.auth-btn {
  background: transparent; border: 1px solid var(--border); color: var(--text);
  padding: 8px 16px; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 14px;
}
.auth-btn:hover { border-color: var(--accent); color: var(--accent); }
.auth-btn.primary { background: var(--accent); border-color: var(--accent); color: #10151d; }
.auth-btn.primary:hover { filter: brightness(1.1); color: #10151d; }

.user-chip { display: flex; align-items: center; gap: 10px; cursor: pointer; padding: 4px 8px; border-radius: 10px; }
.user-chip:hover { background: var(--bg-3); }

/* ---------- avatar ---------- */
.avatar {
  width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center;
  font-size: 20px; color: #10151d; font-weight: 700; flex-shrink: 0;
}
.avatar.lg { width: 96px; height: 96px; font-size: 46px; border-radius: 22px; }
.avatar.sm { width: 32px; height: 32px; font-size: 15px; border-radius: 9px; }

/* ---------- hero ---------- */
.hero {
  background:
    radial-gradient(1000px 400px at 80% -10%, color-mix(in srgb, var(--accent) 22%, transparent), transparent),
    linear-gradient(135deg, var(--bg-2), var(--bg-3));
  border: 1px solid var(--border); border-radius: 24px;
  padding: 54px 44px; margin-bottom: 34px; position: relative; overflow: hidden;
}
.hero h1 { font-size: clamp(28px, 4.5vw, 46px); line-height: 1.15; margin-bottom: 14px; }
.hero h1 em { color: var(--accent); font-style: normal; }
.hero p { color: var(--muted); max-width: 620px; font-size: 17px; margin-bottom: 26px; }
.hero-actions { display: flex; gap: 14px; flex-wrap: wrap; }

.btn {
  display: inline-block; padding: 12px 24px; border-radius: 12px; font-weight: 700;
  border: 1px solid var(--border); background: var(--bg-3); color: var(--text);
  cursor: pointer; font-size: 15px;
}
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.accent { background: var(--accent); border-color: var(--accent); color: #10151d; }
.btn.accent:hover { filter: brightness(1.1); color: #10151d; }

/* ---------- grids & cards ---------- */
.section-title { font-size: 26px; margin: 34px 0 18px; display: flex; align-items: center; gap: 12px; }
.section-title::after { content: ""; flex: 1; height: 1px; background: var(--border); }

.grid { display: grid; gap: 18px; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }

.card {
  background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 20px; transition: .18s;
}
.card:hover { border-color: var(--accent); transform: translateY(-3px); }
.card h3 { margin-bottom: 8px; font-size: 18px; }
.card p { color: var(--muted); font-size: 14px; line-height: 1.55; }
.card .tags { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }

.tag {
  font-size: 12px; padding: 4px 10px; border-radius: 999px;
  background: color-mix(in srgb, var(--accent) 16%, transparent);
  color: var(--accent); font-weight: 600;
}
.tag.plain { background: var(--bg-3); color: var(--muted); }

.map-visual {
  height: 120px; border-radius: 10px; margin-bottom: 14px;
  display: grid; place-items: center; font-size: 40px;
  background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 35%, #1a2331), #10151d);
  border: 1px solid var(--border);
}
.weapon-visual {
  height: 90px; display: grid; place-items: center; font-size: 34px;
  background: var(--bg-3); border-radius: 10px; margin-bottom: 14px; border: 1px solid var(--border);
}

/* ---------- stats ---------- */
.stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 14px; margin: 20px 0; }
.stat {
  background: var(--bg-2); border: 1px solid var(--border); border-radius: 12px;
  padding: 16px; text-align: center;
}
.stat b { display: block; font-size: 24px; color: var(--accent); }
.stat span { font-size: 13px; color: var(--muted); }

/* ---------- tables ---------- */
.table { width: 100%; border-collapse: collapse; background: var(--bg-2); border-radius: var(--radius); overflow: hidden; }
.table th, .table td { padding: 13px 16px; text-align: left; font-size: 14px; }
.table th { background: var(--bg-3); color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .6px; }
.table tr { border-top: 1px solid var(--border); }
.table tr:hover td { background: color-mix(in srgb, var(--accent) 7%, transparent); }
.table td.num { color: var(--accent); font-weight: 700; }

/* ---------- forms ---------- */
.form { background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--radius); padding: 26px; }
.field { margin-bottom: 16px; }
.field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; font-weight: 600; }
.field input, .field textarea, .field select {
  width: 100%; padding: 11px 13px; border-radius: 10px; border: 1px solid var(--border);
  background: var(--bg); color: var(--text); font-size: 15px; font-family: inherit;
}
.field input:focus, .field textarea:focus, .field select:focus {
  outline: none; border-color: var(--accent);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent);
}
.field textarea { min-height: 90px; resize: vertical; }
.field .hint { font-size: 12px; color: var(--muted); margin-top: 5px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 640px) { .form-row { grid-template-columns: 1fr; } }

.error-box {
  background: rgba(255, 77, 77, .12); border: 1px solid rgba(255, 77, 77, .45);
  color: #ff8f8f; padding: 11px 14px; border-radius: 10px; font-size: 14px; margin-bottom: 16px;
}
.ok-box {
  background: color-mix(in srgb, var(--accent) 14%, transparent); border: 1px solid var(--accent);
  color: var(--accent); padding: 11px 14px; border-radius: 10px; font-size: 14px; margin-bottom: 16px;
}

/* ---------- color pickers ---------- */
.swatches { display: flex; gap: 10px; flex-wrap: wrap; }
.swatch {
  width: 34px; height: 34px; border-radius: 50%; cursor: pointer;
  border: 2px solid transparent; position: relative;
}
.swatch:hover { transform: scale(1.1); }
.swatch.selected { border-color: #fff; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 45%, transparent); }
.color-input { display: flex; gap: 10px; align-items: center; margin-top: 10px; }
.color-input input[type="color"] {
  width: 52px; height: 38px; border: 1px solid var(--border); border-radius: 8px;
  background: var(--bg); cursor: pointer; padding: 3px;
}
.preview-box {
  border: 1px dashed var(--border); border-radius: 12px; padding: 16px;
  display: flex; gap: 14px; align-items: center; background: var(--bg);
}
.preview-box .name { font-weight: 700; }
.preview-box .sub { font-size: 13px; color: var(--muted); }

.emoji-grid { display: flex; gap: 8px; flex-wrap: wrap; }
.emoji-opt {
  width: 44px; height: 44px; display: grid; place-items: center; font-size: 20px;
  background: var(--bg-3); border: 2px solid transparent; border-radius: 10px; cursor: pointer;
}
.emoji-opt:hover { border-color: var(--muted); }
.emoji-opt.selected { border-color: var(--accent); }

/* ---------- modal ---------- */
.overlay {
  position: fixed; inset: 0; background: rgba(0, 0, 0, .68); z-index: 100;
  display: grid; place-items: center; padding: 20px;
}
.modal {
  width: min(430px, 100%); background: var(--bg-2); border: 1px solid var(--border);
  border-radius: 18px; padding: 26px;
}
.modal h2 { margin-bottom: 18px; font-size: 22px; }
.tabs { display: flex; gap: 8px; margin-bottom: 20px; background: var(--bg); padding: 5px; border-radius: 12px; }
.tabs button {
  flex: 1; padding: 9px; border: none; border-radius: 9px; background: transparent;
  color: var(--muted); font-weight: 700; cursor: pointer; font-size: 14px;
}
.tabs button.active { background: var(--accent); color: #10151d; }

/* ---------- profile ---------- */
.profile-head {
  display: flex; gap: 22px; align-items: center; flex-wrap: wrap;
  background: linear-gradient(135deg, var(--bg-2), var(--bg-3));
  border: 1px solid var(--border); border-radius: 20px; padding: 28px; margin-bottom: 24px;
}
.profile-head h1 { font-size: 30px; }
.profile-head .meta { color: var(--muted); font-size: 14px; margin-top: 6px; }
.badge {
  display: inline-block; padding: 5px 12px; border-radius: 999px; font-size: 13px; font-weight: 700;
  background: color-mix(in srgb, var(--accent) 20%, transparent); color: var(--accent); margin-top: 10px;
}
.bio { margin-top: 10px; color: var(--muted); max-width: 640px; line-height: 1.6; }

/* ---------- footer ---------- */
.footer { border-top: 1px solid var(--border); padding: 22px 0; font-size: 13px; color: var(--muted); }
.footer p { margin-bottom: 5px; }

@media (max-width: 780px) {
  .header-inner { flex-wrap: wrap; height: auto; padding: 10px 0; gap: 12px; }
  .nav { order: 3; width: 100%; overflow-x: auto; }
  .hero { padding: 34px 22px; }
}

</style>
</head>
<body>

<header class="header">
  <div class="container header-inner">
    <a href="#/" class="logo">CS2<span>HUB</span></a>
    <nav class="nav">
      <a href="#/" data-nav="/">Главная</a>
      <a href="#/maps" data-nav="/maps">Карты</a>
      <a href="#/weapons" data-nav="/weapons">Оружие</a>
      <a href="#/leaderboard" data-nav="/leaderboard">Рейтинг</a>
    </nav>
    <div id="auth-area" class="auth-area"></div>
  </div>
</header>

<main id="app" class="container"></main>

<footer class="footer">
  <div class="container">
    <p>CS2 HUB — фанатский проект. Counter-Strike 2 — торговая марка Valve Corporation.</p>
    <p class="muted">Не является официальным продуктом.</p>
  </div>
</footer>

<div id="modal-root"></div>

<script>
const app = document.getElementById("app");
const authArea = document.getElementById("auth-area");
const modalRoot = document.getElementById("modal-root");

const state = {
  user: null,
  options: { maps: [], weapons: [], avatars: [] },
  route: "/",
};

const MAP_INFO = {
  "Dust II": ["🏜️", "Классика дефьюза", "Самая узнаваемая карта серии. Средний боец, длинные углы и бесконечные дуэли на A-short."],
  "Mirage": ["🕌", "Фаворит соревнований", "Сбалансированный дефьюз с сильными A-site позициями и любимым A-ramp."],
  "Inferno": ["🌋", "Кофе и гранаты", "Плотные угры,香蕉 и обязательные молотовы на B-site."],
  "Nuke": ["☢️", "Два этажа", "Вертикальные бои, ротации через вентиляцию и рискованные ретейки."],
  "Overpass": ["🌉", "Водные пути", "Открытые длинные периметры, A-short и тяжёлые B-anchor."],
  "Ancient": ["🗿", "Джунгли Ацтеков", "Карта с акцентом на контроль средней зоны и быстрые ротации."],
  "Anubis": ["🐪", "Пустынный шторм", "Много воды, мостов и неожиданных fluk-угров."],
  "Train": ["🚂", "Железная дорога", "Возвращённая классика: состав, вагоны и тайминги на B."],
  "Vertigo": ["🏢", "Высотка", "Небольшая карта с высоким темпом и опасными падениями."],
  "Office": ["📠", "Заложники", "Армейский режим: тесные коридоры и круговая оборона."],
};

const WEAPON_INFO = {
  "AK-47": ["Даунтиер шот", "Убивает с одного в голову без шлема. Обязательный тир-1 на T-стороне."],
  "M4A4": ["CT-стандарт", "Стабильная очередь, высокий спред-контроль на средней дистанции."],
  "M4A1-S": ["Тихий убийца", "Приглушённый выстрел и минимальный спред — любовь снайперов-фраггеров."],
  "AWP": ["Один выстрел", "Легендарная винтовка. Экономит раунд или стоит круглых денег."],
  "Desert Eagle": ["Пистолет-икона", "Револьвер за 700$: один точный дроб в голову меняет раунд."],
  "Glock-18": ["Старт T", "Штатный пистолет террористов, 20 патронов и всплеск огня."],
  "USP-S": ["Старт CT", "Точный и тихий — идеален на дистанции до 20 метров."],
  "MP9": ["ECO-стрейф", "Дешёвый SMG для агрессивных анти-эко раундов."],
  "MP5-SD": ["Приглушённый SMG", "Компромисс между уроном и скоростью передвижения."],
  "Galil AR": ["Бюджетный тир-1", "Дешёвая винтовка, когда денег чуть не хватает на AK."],
  "FAMAS": ["CT-бюджет", "Винтовка за 1950$ с очередью и очередным режимом."],
  "SSG 08": ["Снайперский скаут", "Лёгкая винтовка для прыжков и быстрых pick'ов."],
};

const RANKS = [
  "Silver I", "Silver II", "Silver III", "Silver IV", "Silver Elite", "Silver Elite Master",
  "Gold Nova I", "Gold Nova II", "Gold Nova III", "Gold Nova Master",
  "Master Guardian I", "Master Guardian II", "Master Guardian Elite",
  "Legendary Eagle", "Legendary Eagle Master", "Supreme Master First Class", "The Global Elite",
];

const COLORS = ["#f7b731", "#ff5e57", "#20bf6b", "#3dc1d3", "#5b7fff", "#a55eea", "#fd79a8", "#e17055", "#00d2d3", "#ffffff"];

/* ---------------- api ---------------- */
async function api(path, body) {
  if (netMode === "local") return localApi(path, body);
  const opts = body
    ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }
    : {};
  let res;
  try {
    res = await fetch(path, opts);
  } catch (e) {
    netMode = "local";
    return localApi(path, body);
  }
  let data = {};
  try { data = await res.json(); } catch (e) { data = { error: "Ошибка сервера" }; }
  if (!res.ok) throw new Error(data.error || "Ошибка запроса");
  return data;
}

/* -------- локальный режим: работает без сервера (localStorage) -------- */
let netMode = "server";
const LS_USERS = "cs2hub_users";
const LS_TOKEN = "cs2hub_token";
const LOCAL_AVATARS = ["🎯", "💀", "🔥", "⚡", "🗡️", "🛡️", "🦅", "🐺", "🐱", "🤖", "👽", "🦖"];

function loadUsers() {
  try { return JSON.parse(localStorage.getItem(LS_USERS)) || []; } catch (e) { return []; }
}
function saveUsers(list) { localStorage.setItem(LS_USERS, JSON.stringify(list)); }

function localHash(str) {
  let h = 5381;
  for (let i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) >>> 0;
  return h.toString(16);
}

function localPublic(u) {
  const copy = Object.assign({}, u);
  delete copy.password_hash;
  copy.kd = u.deaths ? Math.round((u.kills / u.deaths) * 100) / 100 : u.kills;
  return copy;
}

function localCurrentUser(users) {
  const token = localStorage.getItem(LS_TOKEN);
  if (!token) return null;
  return users.find((u) => u.token === token) || null;
}

function localApi(path, body) {
  const users = loadUsers();
  const fail = (msg, code) => { const e = new Error(msg); e.code = code; throw e; };

  if (path === "/api/options") {
    return { maps: Object.keys(MAP_INFO), weapons: Object.keys(WEAPON_INFO), avatars: LOCAL_AVATARS };
  }

  if (path === "/api/me") {
    const u = localCurrentUser(users);
    return { user: u ? localPublic(u) : null };
  }

  if (path === "/api/register") {
    const username = String(body.username || "").trim();
    const password = String(body.password || "");
    if (!/^[A-Za-z0-9_]{3,20}$/.test(username)) fail("Ник: 3-20 символов, латиница/цифры/_");
    if (password.length < 4) fail("Пароль от 4 символов");
    if (users.some((u) => u.username === username)) fail("Такой ник уже занят");
    const u = {
      id: users.length ? Math.max.apply(null, users.map((x) => x.id)) + 1 : 1,
      username,
      password_hash: localHash(username + ":" + password),
      display_name: username,
      bio: "", steam_id: "",
      avatar_color: "#f7b731", avatar_emoji: "🎯", accent_color: "#f7b731",
      rank: "Silver I", fav_map: "", fav_weapon: "",
      kills: 0, deaths: 0, wins: 0, hours: 0,
      created_at: Math.floor(Date.now() / 1000),
      token: Math.random().toString(16).slice(2) + Date.now().toString(16),
    };
    users.push(u);
    saveUsers(users);
    localStorage.setItem(LS_TOKEN, u.token);
    return { user: localPublic(u) };
  }

  if (path === "/api/login") {
    const username = String(body.username || "").trim();
    const password = String(body.password || "");
    const u = users.find((x) => x.username === username);
    if (!u || u.password_hash !== localHash(username + ":" + password)) fail("Неверный ник или пароль", 401);
    u.token = Math.random().toString(16).slice(2) + Date.now().toString(16);
    saveUsers(users);
    localStorage.setItem(LS_TOKEN, u.token);
    return { user: localPublic(u) };
  }

  if (path === "/api/logout") {
    localStorage.removeItem(LS_TOKEN);
    return { ok: true };
  }

  if (path === "/api/profile") {
    const u = localCurrentUser(users);
    if (!u) fail("Войдите в аккаунт", 401);
    const clean = (v, max) => String(v ?? "").slice(0, max);
    if ("display_name" in body) u.display_name = clean(body.display_name, 24) || u.username;
    if ("bio" in body) u.bio = clean(body.bio, 200);
    if ("steam_id" in body) u.steam_id = clean(body.steam_id, 32);
    if ("rank" in body) u.rank = clean(body.rank, 24);
    if ("fav_map" in body) u.fav_map = clean(body.fav_map, 24);
    if ("fav_weapon" in body) u.fav_weapon = clean(body.fav_weapon, 24);
    for (const key of ["avatar_color", "accent_color"]) {
      if (key in body) {
        if (!/^#[0-9a-fA-F]{6}$/.test(String(body[key]))) fail("Некорректный цвет");
        u[key] = body[key];
      }
    }
    if ("avatar_emoji" in body) {
      if (LOCAL_AVATARS.indexOf(body.avatar_emoji) === -1) fail("Такого аватара нет");
      u.avatar_emoji = body.avatar_emoji;
    }
    if (body.password) {
      if (String(body.password).length < 4) fail("Пароль от 4 символов");
      u.password_hash = localHash(u.username + ":" + body.password);
    }
    saveUsers(users);
    return { user: localPublic(u) };
  }

  if (path === "/api/leaderboard") {
    const list = users.slice().sort((a, b) => (b.wins - a.wins) || (b.kills - a.kills)).slice(0, 20);
    return { users: list.map(localPublic) };
  }

  if (path.indexOf("/api/user/") === 0) {
    const id = parseInt(path.split("/").pop(), 10);
    const u = users.find((x) => x.id === id);
    if (!u) fail("Игрок не найден", 404);
    return { user: localPublic(u) };
  }

  fail("Неизвестный метод");
}

function esc(str) {
  return String(str ?? "").replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function applyTheme(color) {
  document.documentElement.style.setProperty("--accent", color);
}

function avatarHtml(user, cls = "") {
  const c = user?.avatar_color || "#f7b731";
  const e = user?.avatar_emoji || "🎯";
  return `<div class="avatar ${cls}" style="background:${esc(c)}">${esc(e)}</div>`;
}

/* ---------------- header ---------------- */
function renderAuthArea() {
  if (state.user) {
    authArea.innerHTML = `
      <div class="user-chip" onclick="location.hash='#/profile'">
        ${avatarHtml(state.user, "sm")}
        <span>${esc(state.user.display_name)}</span>
      </div>
      <button class="auth-btn" onclick="location.hash='#/settings'">Настройки</button>
      <button class="auth-btn" id="logout-btn">Выйти</button>`;
    document.getElementById("logout-btn").onclick = async () => {
      await api("/api/logout", {});
      state.user = null;
      applyTheme("#f7b731");
      renderAuthArea();
      location.hash = "#/";
      render();
    };
  } else {
    authArea.innerHTML = `
      <button class="auth-btn" id="login-btn">Войти</button>
      <button class="auth-btn primary" id="reg-btn">Регистрация</button>`;
    document.getElementById("login-btn").onclick = () => openAuthModal("login");
    document.getElementById("reg-btn").onclick = () => openAuthModal("register");
  }
}

/* ---------------- auth modal ---------------- */
function openAuthModal(tab = "login") {
  modalRoot.innerHTML = `
    <div class="overlay" id="overlay">
      <div class="modal">
        <div class="tabs">
          <button data-tab="login" class="${tab === "login" ? "active" : ""}">Вход</button>
          <button data-tab="register" class="${tab === "register" ? "active" : ""}">Регистрация</button>
        </div>
        <div id="modal-error"></div>
        <form id="auth-form">
          <div class="field">
            <label>Ник</label>
            <input name="username" maxlength="20" autocomplete="username" required placeholder="например, s1mple_fan">
          </div>
          <div class="field">
            <label>Пароль</label>
            <input name="password" type="password" minlength="4" autocomplete="current-password" required placeholder="••••••">
          </div>
          <button class="btn accent" style="width:100%" type="submit">
            ${tab === "login" ? "Войти" : "Создать аккаунт"}
          </button>
        </form>
        <p class="muted" style="margin-top:14px;font-size:13px;text-align:center">
          Аккаунт хранится локально на этом сервере.
        </p>
      </div>
    </div>`;

  const overlay = document.getElementById("overlay");
  overlay.onclick = (e) => { if (e.target === overlay) modalRoot.innerHTML = ""; };
  modalRoot.querySelectorAll("[data-tab]").forEach((b) => {
    b.onclick = () => openAuthModal(b.dataset.tab);
  });

  document.getElementById("auth-form").onsubmit = async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const payload = { username: fd.get("username"), password: fd.get("password") };
    try {
      const data = await api(tab === "login" ? "/api/login" : "/api/register", payload);
      state.user = data.user;
      applyTheme(data.user.accent_color);
      modalRoot.innerHTML = "";
      renderAuthArea();
      render();
    } catch (err) {
      document.getElementById("modal-error").innerHTML =
        `<div class="error-box">${esc(err.message)}</div>`;
    }
  };
}

    return `<div class="card"><h3>Игрок не найден</h3><p>${esc(e.message)}</p></div>`;

function bindSettings() {
  const form = document.getElementById("settings-form");
  if (!form) return;

  const pick = (name, value) => {
    form.querySelector(`[name="${name}"]`).value = value;
    updatePreview();
  };

  const wireSwatches = (containerId, name) => {
    const box = document.getElementById(containerId);
    box.querySelectorAll(".swatch").forEach((s) => {
      s.onclick = () => {
        box.querySelectorAll(".swatch").forEach((x) => x.classList.remove("selected"));
        s.classList.add("selected");
        pick(name, s.dataset.color);
        if (name === "accent_color") applyTheme(s.dataset.color);
      };
    });
  };
  wireSwatches("avatar-swatches", "avatar_color");
  wireSwatches("accent-swatches", "accent_color");

  form.querySelectorAll(".emoji-opt").forEach((el) => {
    el.onclick = () => {
      form.querySelectorAll(".emoji-opt").forEach((x) => x.classList.remove("selected"));
      el.classList.add("selected");
      pick("avatar_emoji", el.dataset.emoji);
    };
  });

  document.getElementById("avatar-color-input").oninput = (e) => {
    document.querySelectorAll("#avatar-swatches .swatch").forEach((x) => x.classList.remove("selected"));
    pick("avatar_color", e.target.value);
  };
  document.getElementById("accent-color-input").oninput = (e) => {
    document.querySelectorAll("#accent-swatches .swatch").forEach((x) => x.classList.remove("selected"));
    pick("accent_color", e.target.value);
    applyTheme(e.target.value);
  };

  form.display_name.oninput = () => updatePreview();
  form.rank.onchange = () => updatePreview();

  function updatePreview() {
    document.getElementById("preview-avatar").style.background = form.avatar_color.value;
    document.getElementById("preview-avatar").textContent = form.avatar_emoji.value;
    document.getElementById("preview-name").textContent = form.display_name.value || "Без имени";
    document.getElementById("preview-rank").textContent = form.rank.value;
    const a = form.accent_color.value;
    document.getElementById("preview-accent").textContent = a;
    document.getElementById("preview-accent").style.color = a;
  }

  form.onsubmit = async (e) => {
    e.preventDefault();
    const msg = document.getElementById("settings-msg");
    const payload = {
      display_name: form.display_name.value.trim(),
      steam_id: form.steam_id.value.trim(),
      bio: form.bio.value.trim(),
      rank: form.rank.value,
      fav_map: form.fav_map.value,
      fav_weapon: form.fav_weapon.value,
      avatar_emoji: form.avatar_emoji.value,
      avatar_color: form.avatar_color.value,
      accent_color: form.accent_color.value,
    };
    if (form.password.value || form.password2.value) {
      if (form.password.value !== form.password2.value) {
        msg.innerHTML = `<div class="error-box">Пароли не совпадают</div>`;
        return;
      }
      payload.password = form.password.value;
    }
    try {
      const data = await api("/api/profile", payload);
      state.user = data.user;
      applyTheme(data.user.accent_color);
      renderAuthArea();
      msg.innerHTML = `<div class="ok-box">Настройки сохранены ✓</div>`;
      window.scrollTo({ top: 0, behavior: "smooth" });
    } catch (err) {
      msg.innerHTML = `<div class="error-box">${esc(err.message)}</div>`;
    }
  };
}

/* ---------------- router ---------------- */
async function render() {
  const hash = location.hash.replace(/^#/, "") || "/";
  state.route = hash;
  document.querySelectorAll(".nav a").forEach((a) => {
    a.classList.toggle("active", a.dataset.nav === hash.split("/").slice(0, 2).join("/") || a.dataset.nav === hash);
  });

  let html = "";
  try {
    if (hash === "/") html = pageHome();
    else if (hash === "/maps") html = pageMaps();
    else if (hash === "/weapons") html = pageWeapons();
    else if (hash === "/leaderboard") html = await pageLeaderboard();
    else if (hash === "/profile") html = pageProfile();
    else if (hash === "/settings") html = pageSettings();
    else if (hash.startsWith("/user/")) html = await pageUser(hash.split("/")[2]);
    else html = `<div class="card"><h3>404 — страница не найдена</h3>
      <p><a href="#/">Вернуться на главную</a></p></div>`;
  } catch (err) {
    html = `<div class="card"><h3>Ошибка</h3><p>${esc(err.message)}</p></div>`;
  }

  app.innerHTML = html;
  bindSettings();
}

/* ---------------- init ---------------- */
async function init() {
  try {
    const [me, opts] = await Promise.all([api("/api/me"), api("/api/options")]);
    state.user = me.user;
    state.options = opts;
    if (state.user) applyTheme(state.user.accent_color);
  } catch (e) { /* сервер недоступен */ }

  renderAuthArea();
  window.addEventListener("hashchange", render);
  render();
}

init();

</script>
